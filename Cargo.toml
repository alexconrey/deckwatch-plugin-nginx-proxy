[package]
name = "deckwatch-plugin-nginx-proxy"
version = "0.1.0"
edition = "2021"
description = "Deckwatch plugin — injects an nginx reverse-proxy sidecar into opted-in deployments"
repository = "https://github.com/alexconrey/deckwatch-plugin-nginx-proxy"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
deckwatch-plugin-sdk = { git = "https://github.com/alexconrey/deckwatch-plugin-sdk", tag = "v0.10.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
extism-pdk = "1"
